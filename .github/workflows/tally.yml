name: tally

on:
  issues:
    types: [opened, edited, closed, reopened, deleted]

# 매번 전체 이슈를 다시 집계하므로 대기 중 실행이 최신 실행으로 대체돼도 결과가 같다.
concurrency:
  group: tally
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  tally:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 기본값은 이벤트 시점 커밋이라, 앞선 실행이 push한 뒤 돌면 push가 거부된다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - run: node scripts/tally.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTION: ${{ github.event.action }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md status.json
          git diff --cached --quiet || { git commit -m 'Update attendance'; git push; }
